# Perfil exclusivo para pruebas automatizadas.
# La conexión MySQL será proporcionada por Testcontainers.

spring:
  jpa:
    hibernate:
      # Valida las entidades JPA contra el esquema SQL existente.
      # No crea ni modifica automáticamente las tablas.
      ddl-auto: validate

  sql:
    init:
      # El esquema se inicializará desde Testcontainers.
      # Evitamos una segunda inicialización por Spring SQL.
      mode: never

# Clave JWT exclusiva para pruebas automatizadas.
# No se utiliza en producción.
feriaconecta:
  jwt:
    secret: ${JWT_SECRET:test-secret-feriaconecta-solo-para-pruebas-0123456789}

  # Origen permitido durante las pruebas automatizadas de CORS.
  cors:
    allowed-origins: http://localhost:5173
