# Perfil de desarrollo: base de datos H2 en memoria (no requiere MySQL).
spring:
  datasource:
    url: jdbc:h2:mem:feriaconecta;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Valores por defecto SOLO para desarrollo: permiten arrancar sin .env.
feriaconecta:
  jwt:
    secret: ${JWT_SECRET:dev-secret-feriaconecta-no-usar-en-produccion-0123456789}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
  urls:
    backend: ${APP_BACKEND_URL:http://localhost:8080/api/v1}
    frontend: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
