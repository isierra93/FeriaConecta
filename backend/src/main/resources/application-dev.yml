# Perfil de desarrollo: base de datos H2 en memoria (no requiere MySQL).
spring:
  datasource:
    url: jdbc:h2:mem:feriaconecta;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
