spring:
  application:
    name: feriaconecta-backend
  profiles:
    active: dev

server:
  servlet:
    context-path: /api/v1

# Actuator: se expone unicamente el endpoint health
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.feriaconecta.backend: INFO
    org.springframework.web: INFO
