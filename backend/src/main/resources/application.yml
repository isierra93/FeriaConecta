spring:
  application:
    name: feriaconecta-backend
  # Lee el archivo .env local si existe (formato CLAVE=valor). En produccion
  # las variables llegan del entorno del contenedor. Ver backend/.env.example
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  servlet:
    context-path: /api/v1
  # Defensa adicional para errores que no pasan por GlobalExceptionHandler:
  # nunca exponer stack traces ni mensajes internos al cliente.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Actuator: se expone unicamente el endpoint health
management:
  endpoints:
    web:
      exposure:
        include: health

# Documentacion OpenAPI / Swagger UI (rutas relativas al context-path /api/v1).
# Deshabilitado en produccion (application-prod.yml).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    # Conserva el token cargado en "Authorize" al recargar la pagina
    persist-authorization: true
  default-produces-media-type: application/json

logging:
  level:
    com.feriaconecta.backend: INFO
    org.springframework.web: INFO

# Configuracion propia de la aplicacion. Los secretos no tienen valor por
# defecto aca: los defaults de desarrollo viven en application-dev.yml.
feriaconecta:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN}
    webhook-secret: ${MP_WEBHOOK_SECRET}
  urls:
    backend: ${APP_BACKEND_URL}
    frontend: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  pago:
    plazo-horas: ${PAGO_PLAZO_HORAS:72}
