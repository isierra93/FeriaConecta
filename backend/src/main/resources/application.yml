spring:
  application:
    name: feriaconecta-backend
  # Lee el archivo .env local si existe (formato CLAVE=valor). En produccion
  # las variables llegan del entorno del contenedor. Ver backend/.env.example
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  servlet:
    context-path: /api/v1

# Actuator: se expone unicamente el endpoint health
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.feriaconecta.backend: INFO
    org.springframework.web: INFO

# Configuracion propia de la aplicacion. Los secretos no tienen valor por
# defecto aca: los defaults de desarrollo viven en application-dev.yml.
feriaconecta:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN}
    webhook-secret: ${MP_WEBHOOK_SECRET}
  urls:
    backend: ${APP_BACKEND_URL}
    frontend: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  pago:
    plazo-horas: ${PAGO_PLAZO_HORAS:72}
