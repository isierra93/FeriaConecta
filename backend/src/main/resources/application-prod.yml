# Perfil de produccion: MySQL. Las variables se cargan desde el entorno (ver backend/.env.example).
# El esquema es gestionado por database/schema.sql; Hibernate solo valida el mapeo.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

# Swagger no se expone en produccion: la API es publica via Nginx Proxy Manager.
# Las rutas quedan en permitAll en SecurityConfig, pero responden 404.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
